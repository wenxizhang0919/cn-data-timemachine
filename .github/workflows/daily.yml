name: daily-snapshot

on:
  schedule:
    # GitHub 的定时触发在高峰期可能延迟甚至被丢弃（2026-10-22 的 10:17 那次就没有触发），
    # 所以每天安排 4 次（北京时间 10:17 / 13:37 / 17:07 / 20:37）。
    # 第一次成功的运行负责采集，之后的运行发现当天数据已在，就直接跳过，不产生新提交。
    - cron: "17 2 * * *"
    - cron: "37 5 * * *"
    - cron: "7 9 * * *"
    - cron: "37 12 * * *"
  # 保险：外部值守（或你在网页上改动这个文件）可以随时补触发一次采集
  push:
    paths:
      - ".github/kick"
  workflow_dispatch:
    inputs:
      force:
        description: "当天已采集也重新采集（只会覆盖当天的文件）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt opentimestamps-client

      - name: Date (Asia/Shanghai)
        id: d
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Collect
        id: collect
        continue-on-error: true
        run: python collect.py ${{ inputs.force && '--force' || '' }}

      # 当天数据已经齐了（之前的运行已采集）就跳过后续步骤，避免重复提交
      - name: Anything new?
        id: changed
        run: |
          # 两种情况需要继续：本次采到了新数据；或国内服务器推送了当天数据、账本还没登记
          if [ -n "$(git status --porcelain data/raw)" ] || ! python ledger.py "${{ steps.d.outputs.date }}" --check; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "当天数据已存在，无需重复处理"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ledger (hash chain) and catalog
        if: steps.changed.outputs.yes == 'true'
        run: |
          python ledger.py "${{ steps.d.outputs.date }}"
          python make_catalog.py

      # 公共时间戳：把当天账本的哈希提交给 OpenTimestamps 日历服务器，几小时后锚定到比特币区块。
      # 之后每天顺便把旧的时间戳证明升级为完整证明。失败不影响采集。
      - name: OpenTimestamps
        if: steps.changed.outputs.yes == 'true'
        continue-on-error: true
        run: |
          rm -f "ledger/${{ steps.d.outputs.date }}.json.ots"
          ots stamp "ledger/${{ steps.d.outputs.date }}.json"
          for f in ledger/*.json.ots; do ots upgrade "$f" || true; done
          # ots upgrade 会留下 .bak 备份文件，不需要入库
          rm -f ledger/*.ots.bak

      - name: Verify and commit
        if: steps.changed.outputs.yes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data ledger DATASETS.md datasets.json
          python scripts/check_immutable.py "${{ steps.d.outputs.date }}"
          python scripts/verify.py
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "data: ${{ steps.d.outputs.date }}"
          # 运行期间仓库可能有新提交（例如新增了数据源），先变基再推，最多重试 3 次
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && break
            sleep 5
          done
          # 当日版本标签：论文可引用到某一天的确切版本
          tag="snapshot-${{ steps.d.outputs.date }}"
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"

      # 有数据源失败时让整个任务标红，GitHub 会发邮件提醒仓库主人
      - name: Fail if any source failed
        if: steps.collect.outcome == 'failure'
        run: exit 1
